# Dev-only overrides — not committed with secrets in real projects
services:
  postgres:
    environment:
      POSTGRES_PASSWORD: dev
    # Host 5432 is often taken by another project's DB locally; the app only needs
    # postgres on the docker network, so remap the host publish to avoid the clash.
    ports: !override
      - "5434:5432"
  rabbitmq:
    environment:
      RABBITMQ_DEFAULT_PASS: dev
  frontend:
    environment:
      # No TLS termination in front of the frontend container locally — tell the
      # Identity Service the real scheme so it computes the right OIDC issuer.
      FORWARDED_PROTO: http
